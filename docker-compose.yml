services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemedicine
      POSTGRES_USER: telemedicine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemedicine -d telemedicine"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-50000:49152-50000/udp"
    volumes:
      - ./infra/coturn.conf:/etc/coturn/turnserver.conf:ro
    network_mode: "host"

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  mock-his:
    build: ./mock_his
    environment:
      HIS_API_KEY: ${HIS_API_KEY:-his-dev-key-change-me}
    ports:
      - "8100:8100"
    volumes:
      - hisdata:/data
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://telemedicine:${POSTGRES_PASSWORD:-change-me}@db:5432/telemedicine
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      REDIS_URL: redis://redis:6379/0
      COTURN_AUTH_SECRET: ${COTURN_AUTH_SECRET:-careconnect-turn-secret-change-me}
      COTURN_REALM: ${COTURN_REALM:-telemedicine.careconnect.local}
      COTURN_HOST: ${COTURN_HOST:-72.61.123.73}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-vietqr-webhook-secret-key-2026}
      HIS_ADAPTER: ${HIS_ADAPTER:-mock}
      HIS_BASE_URL: ${HIS_BASE_URL:-http://mock-his:8100}
      HIS_API_KEY: ${HIS_API_KEY:-his-dev-key-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_LIVEKIT_URL: ws://localhost:7880
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  hisdata:
