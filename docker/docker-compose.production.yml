# Cụm Hạ Tầng Production Hoàn Chỉnh cho Bệnh Viện: Telemedicine + HIS/EMR + LiveKit SFU + Orthanc PACS
version: '3.9'

services:
  # 1. Reverse Proxy & Tự động cấp phát chứng chỉ SSL TLS 1.3
  caddy:
    image: caddy:2.7-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - medical_network

  # 2. WebRTC SFU Server (LiveKit) - Hội chẩn Video trực tuyến đa điểm
  livekit:
    image: livekit/livekit-server:v1.6
    restart: always
    network_mode: host # Tối ưu hóa độ trễ thấp WebRTC UDP
    environment:
      - LIVEKIT_CONFIG=/etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

  # 3. Orthanc DICOM PACS Server - Lưu trữ & Stream ảnh X-Quang, CT, MRI chuẩn WADO-RS
  orthanc-pacs:
    image: orthancteam/orthanc:24.3.0
    restart: always
    ports:
      - "8042:8042" # HTTP REST API & DICOMweb
      - "4242:4242" # Cổng nhận ảnh DICOM C-STORE từ máy chụp bệnh viện
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - pacs_storage:/var/lib/orthanc/db
    networks:
      - medical_network

  # 4. Cơ sở dữ liệu Bệnh án Điện tử PostgreSQL HL7 FHIR R4
  postgres-fhir:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: his_emr_fhir
      POSTGRES_USER: medical_admin
      POSTGRES_PASSWORD: StrongProductionPassword2026!
    volumes:
      - postgres_fhir_data:/var/lib/postgresql/data
    networks:
      - medical_network

  # 5. Redis Cache & Pub/Sub cho tín hiệu Telemetry IoT
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass StrongRedisPassword2026!
    networks:
      - medical_network

  # 6. Core Fullstack Telemedicine App (React SPA + REST API + WebSocket Server)
  web-app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://medical_admin:StrongProductionPassword2026!@postgres-fhir:5432/his_emr_fhir
      - REDIS_URL=redis://:StrongRedisPassword2026!@redis:6379
      - VIETQR_WEBHOOK_SECRET=vietqr_production_secret_key_2026
    networks:
      - medical_network

networks:
  medical_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  pacs_storage:
  postgres_fhir_data:
