# Coturn Configuration for CareConnect Telemedicine
# Hỗ trợ WebRTC STUN/TURN traversal qua NAT, Firewall và mạng di động 3G/4G/5G

listening-port=3478
tls-listening-port=5349
alt-listening-port=443
alt-tls-listening-port=443

# Dải port chuyển tiếp gói tin RTP/RTCP
min-port=49152
max-port=50000

# Cơ chế xác thực
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=careconnect-turn-secret-change-me
realm=telemedicine.careconnect.local

# Bảo mật và lọc mạng
no-loopback-peers
no-multicast-peers
stale-nonce=600

# Logging
verbose
no-stdout-log
log-file=/var/log/turnserver.log
